name: PostgreSQL Integration

on:
  push:
    branches:
      - test/postgres-inventory-integration-20261118

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres:
    name: PostgreSQL 16 migration and inventory concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: emporia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emporia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      EMPORIA_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/emporia_test
      EMPORIA_API_TOKEN: test-secret
      EMPORIA_JWT_SECRET: unit-test-jwt-secret-with-at-least-32-chars
      EMPORIA_ALLOW_REGISTRATION: "true"
      EMPORIA_WORKSPACE_ID: test-workspace
      EMPORIA_ENVIRONMENT: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply all Alembic migrations to PostgreSQL
        run: alembic upgrade head
      - name: Verify PostgreSQL migration head and tenant foreign key
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          from emporia_api.config import settings

          engine = create_engine(settings.database_url)
          try:
              with engine.connect() as connection:
                  revision = connection.scalar(text("SELECT version_num FROM alembic_version"))
              assert revision == "0014_inventory_ws_fk", revision

              foreign_keys = inspect(engine).get_foreign_keys("inventory_movements")
              assert any(
                  item["name"] == "fk_inventory_movements_product_workspace"
                  and item["constrained_columns"] == ["product_id", "workspace_id"]
                  and item["referred_columns"] == ["id", "workspace_id"]
                  and item["referred_table"] == "products"
                  for item in foreign_keys
              ), foreign_keys
          finally:
              engine.dispose()
          PY
      - name: Run Ruff
        run: ruff check src tests
      - name: Run full API test suite on PostgreSQL
        run: pytest -q
