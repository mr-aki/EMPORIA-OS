services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emporia}
      POSTGRES_USER: ${POSTGRES_USER:-emporia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-postgres-password}
    volumes:
      - emporia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMPORIA_ENVIRONMENT: ${EMPORIA_ENVIRONMENT:-development}
      EMPORIA_DATABASE_URL: ${EMPORIA_DATABASE_URL:-postgresql+psycopg://emporia:local-dev-postgres-password@postgres:5432/emporia}
      EMPORIA_API_TOKEN: ${EMPORIA_API_TOKEN:-local-development-token-change-this}
      EMPORIA_JWT_SECRET: ${EMPORIA_JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      EMPORIA_ALLOW_REGISTRATION: ${EMPORIA_ALLOW_REGISTRATION:-false}
      EMPORIA_WORKSPACE_ID: ${EMPORIA_WORKSPACE_ID:-local-workspace}
      EMPORIA_AGENT_MAX_OUTPUT_TOKENS: ${EMPORIA_AGENT_MAX_OUTPUT_TOKENS:-2048}
      EMPORIA_SKILL_MAX_OUTPUT_TOKENS: ${EMPORIA_SKILL_MAX_OUTPUT_TOKENS:-2048}
      EMPORIA_OPENAI_API_KEY: ${EMPORIA_OPENAI_API_KEY:-}
      EMPORIA_ANTHROPIC_API_KEY: ${EMPORIA_ANTHROPIC_API_KEY:-}
      EMPORIA_GEMINI_API_KEY: ${EMPORIA_GEMINI_API_KEY:-}
      EMPORIA_OPENAI_COMPATIBLE_BASE_URL: ${EMPORIA_OPENAI_COMPATIBLE_BASE_URL:-}
      EMPORIA_OPENAI_COMPATIBLE_API_KEY: ${EMPORIA_OPENAI_COMPATIBLE_API_KEY:-}
      EMPORIA_BRAVE_SEARCH_API_KEY: ${EMPORIA_BRAVE_SEARCH_API_KEY:-}
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "emporia_api.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMPORIA_ENVIRONMENT: ${EMPORIA_ENVIRONMENT:-development}
      EMPORIA_DATABASE_URL: ${EMPORIA_DATABASE_URL:-postgresql+psycopg://emporia:local-dev-postgres-password@postgres:5432/emporia}
      EMPORIA_API_TOKEN: ${EMPORIA_API_TOKEN:-local-development-token-change-this}
      EMPORIA_JWT_SECRET: ${EMPORIA_JWT_SECRET:-local-development-jwt-secret-change-before-deploy}
      EMPORIA_ALLOW_REGISTRATION: ${EMPORIA_ALLOW_REGISTRATION:-false}
      EMPORIA_WORKER_POLL_SECONDS: ${EMPORIA_WORKER_POLL_SECONDS:-2}
      EMPORIA_WORKER_LEASE_SECONDS: ${EMPORIA_WORKER_LEASE_SECONDS:-300}
      EMPORIA_WORKER_BACKOFF_BASE_SECONDS: ${EMPORIA_WORKER_BACKOFF_BASE_SECONDS:-5}
      EMPORIA_WORKER_BACKOFF_MAX_SECONDS: ${EMPORIA_WORKER_BACKOFF_MAX_SECONDS:-300}
      EMPORIA_AGENT_MAX_OUTPUT_TOKENS: ${EMPORIA_AGENT_MAX_OUTPUT_TOKENS:-2048}
      EMPORIA_SKILL_MAX_OUTPUT_TOKENS: ${EMPORIA_SKILL_MAX_OUTPUT_TOKENS:-2048}
      EMPORIA_AGENT_RUNS_PER_MINUTE: ${EMPORIA_AGENT_RUNS_PER_MINUTE:-10}
      EMPORIA_SKILL_RUNS_PER_MINUTE: ${EMPORIA_SKILL_RUNS_PER_MINUTE:-20}
      EMPORIA_AGENT_MAX_CONCURRENT_RUNS: ${EMPORIA_AGENT_MAX_CONCURRENT_RUNS:-3}
      EMPORIA_SKILL_MAX_CONCURRENT_RUNS: ${EMPORIA_SKILL_MAX_CONCURRENT_RUNS:-5}
      EMPORIA_EXECUTION_LEASE_SECONDS: ${EMPORIA_EXECUTION_LEASE_SECONDS:-300}
      EMPORIA_OPENAI_API_KEY: ${EMPORIA_OPENAI_API_KEY:-}
      EMPORIA_ANTHROPIC_API_KEY: ${EMPORIA_ANTHROPIC_API_KEY:-}
      EMPORIA_GEMINI_API_KEY: ${EMPORIA_GEMINI_API_KEY:-}
      EMPORIA_OPENAI_COMPATIBLE_BASE_URL: ${EMPORIA_OPENAI_COMPATIBLE_BASE_URL:-}
      EMPORIA_OPENAI_COMPATIBLE_API_KEY: ${EMPORIA_OPENAI_COMPATIBLE_API_KEY:-}
      EMPORIA_BRAVE_SEARCH_API_KEY: ${EMPORIA_BRAVE_SEARCH_API_KEY:-}
    restart: unless-stopped

volumes:
  emporia_postgres_data:
